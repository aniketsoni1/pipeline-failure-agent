name: VS Code Extension

on:
  pull_request:
    paths: ['apps/vscode-extension/**', 'packages/**']
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Install extension deps
        working-directory: apps/vscode-extension
        run: npm install
      - name: Bundle extension
        working-directory: apps/vscode-extension
        run: npm run build
      - name: Package VSIX
        working-directory: apps/vscode-extension
        run: npx --yes @vscode/vsce package --no-dependencies -o pipeline-failure-agent.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: apps/vscode-extension/pipeline-failure-agent.vsix

  # Publishes ONLY when the relevant token secret is configured — otherwise each
  # step skips, so a tag push does not fail before you're ready to publish.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for Entra ID workload identity federation (OIDC).
      id-token: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: npm }
      - run: npm ci && (cd apps/vscode-extension && npm install && npm run build)

      # ────────────────────────────────────────────────────────────────
      # Authentication mode.
      #
      # Global Azure DevOps Personal Access Tokens are retired on
      # 1 December 2026, after which PAT-based publishing stops working:
      # https://devblogs.microsoft.com/devops/retirement-of-global-personal-access-tokens-in-azure-devops/
      #
      # Preferred:  Entra ID workload identity federation (no stored secret).
      #             Set AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID.
      # Fallback:   VSCE_PAT, until the retirement date.
      # ────────────────────────────────────────────────────────────────
      - name: Determine publish credentials
        id: auth
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "mode=entra" >> "$GITHUB_OUTPUT"
            echo "Publishing with Entra ID workload identity federation."
          elif [ -n "$VSCE_PAT" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "::warning::Publishing with a Personal Access Token. Global Azure DevOps PATs retire on 2026-12-01 - migrate to Entra ID before then."
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No Marketplace credentials configured - skipping Marketplace publish."
          fi

      - name: Azure login (workload identity federation)
        if: steps.auth.outputs.mode == 'entra'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to VS Code Marketplace (Entra ID)
        if: steps.auth.outputs.mode == 'entra'
        working-directory: apps/vscode-extension
        run: npx --yes @vscode/vsce publish --azure-credential --no-dependencies

      - name: Publish to VS Code Marketplace (PAT - deprecated)
        if: steps.auth.outputs.mode == 'pat'
        working-directory: apps/vscode-extension
        run: npx --yes @vscode/vsce publish --no-dependencies

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        working-directory: apps/vscode-extension
        run: npx --yes ovsx publish --no-dependencies -p "$OVSX_PAT"

      - name: Skip notice
        if: ${{ steps.auth.outputs.mode == 'none' && env.OVSX_PAT == '' }}
        run: echo "No Marketplace or Open VSX credentials set — skipping extension publish."
